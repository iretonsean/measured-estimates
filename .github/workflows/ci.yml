name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # T-90: tests on Python 3.9 and the newest Python, on Linux and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests (T-90)
        run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
          python -W ignore -m unittest discover -s tests -t tests -v
      - name: Timing T-93 (child record) and T-114 (hook process)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then budget=4.0; else budget=2.0; fi
          python tools/ci/timing.py --child-budget "$budget" --hook-budget 0.2

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: Secret and personal-data scan T-52 with self-test T-53
        run: |
          python tools/ci/scan.py --self-test
          python tools/ci/scan.py .
      - name: Starter table aggregates T-50 with self-test T-51 and results check T-135
        run: |
          python tools/ci/check_aggregates.py --self-test
          python tools/ci/check_aggregates.py data/starter.json
          if [ -f docs/results.json ]; then python tools/ci/check_aggregates.py docs/results.json; fi
      - name: Manifests T-89
        run: python tools/ci/check_repo.py manifests
      - name: Versions agree (T-99 support)
        run: python tools/ci/check_repo.py versions
      - name: Standard library only T-91
        run: python tools/ci/check_repo.py stdlib
      - name: README language T-111 T-112 and README numbers T-109
        run: |
          python tools/ci/lint_readme.py --self-test
          python tools/ci/lint_readme.py README.md
          python tools/ci/lint_readme.py --numbers README.md docs/RESULTS.md
